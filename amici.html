<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solco — Amici</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1a19">
<link rel="stylesheet" href="/assets/style.css">
<script>
  var desktopOk = document.cookie.indexOf('desktop_ok=1') !== -1;
  if (!desktopOk && !(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone)) {
    location.replace('/install.html');
  }
</script>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <h1>Amici</h1>
    <button class="icon-btn" id="profile-btn" aria-label="Profilo e impostazioni"></button>
  </div>

  <div id="activity-block" style="display:none">
    <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700);margin-bottom:2px">Attività recente</div>
    <div id="activity-feed"></div>
  </div>

  <div id="friends-list" style="display:flex;flex-direction:column;gap:2px"></div>
  <div id="empty-state" class="empty-state" style="display:none">
    <h3>Sei solo qui, per ora</h3>
    <p>Invita qualcuno dal pannello "Utenti e inviti" per vedere la sua collezione.</p>
  </div>
</div>

<nav class="tabbar">
  <a class="tab" href="/index.html"><span class="tab-icon">▤</span>Libreria</a>
  <button class="tab active"><span class="tab-icon">◐</span>Amici</button>
  <a class="tab" href="/statistiche.html"><span class="tab-icon">◆</span>Statistiche</a>
  <a class="tab" href="/cerca.html"><span class="tab-icon">☆</span>Da cercare</a>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="profile-sheet">
  <div class="sheet-handle"></div>
  <div style="display:flex;align-items:center;gap:12px">
    <div id="profile-avatar" style="width:52px;height:52px;background:var(--color-neutral-200);flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden"></div>
    <div>
      <h3 id="profile-username" style="font-size:18px">—</h3>
      <p id="profile-bio" style="font-size:13px;color:var(--color-neutral-700);margin-top:2px"></p>
    </div>
  </div>
  <a href="/profilo.html" class="btn btn-secondary btn-block">Modifica profilo</a>
  <div id="admin-link-wrap" style="display:none">
    <a href="/admin.html" class="btn btn-secondary btn-block">Gestisci utenti e inviti</a>
  </div>
  <button class="btn btn-outline btn-block" id="logout-btn">Esci</button>
</div>

<script src="/assets/app.js"></script>
<script>
  initProfileMenu();

  function timeAgo(iso) {
    const diffMin = Math.round((Date.now() - new Date(iso + 'Z').getTime()) / 60000);
    if (diffMin < 1) return 'adesso';
    if (diffMin < 60) return diffMin + ' min fa';
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return diffH + ' h fa';
    const diffD = Math.round(diffH / 24);
    if (diffD < 7) return diffD + ' g fa';
    return new Date(iso + 'Z').toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
  }

  async function loadActivity() {
    try {
      const { activity } = await api('/api/activity');
      if (activity.length === 0) return;
      document.getElementById('activity-block').style.display = 'block';
      document.getElementById('activity-feed').innerHTML = activity.slice(0, 8).map(a => `
        <div class="activity-item">
          <span style="flex:1"><strong>${a.actor}</strong> ${a.action}</span>
          <span class="activity-time">${timeAgo(a.created_at)}</span>
        </div>
      `).join('');
    } catch { /* non blocca il resto della pagina */ }
  }

  async function init() {
    loadActivity();
    try {
      const { friends } = await api('/api/friends');
      const list = document.getElementById('friends-list');
      if (friends.length === 0) { document.getElementById('empty-state').style.display = 'block'; return; }
      list.innerHTML = friends.map(f => `
        <a class="detail-row" style="align-items:center;text-decoration:none;color:inherit" href="/amico.html?user=${encodeURIComponent(f.username)}">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:44px;height:44px;background:var(--color-neutral-200);flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden">
              ${f.avatar_url
                ? `<img src="${f.avatar_url}" style="width:100%;height:100%;object-fit:cover">`
                : `<span style="font-family:var(--font-heading);font-weight:800;color:var(--color-neutral-700)">${f.username[0].toUpperCase()}</span>`}
            </div>
            <div>
              <div style="font-family:var(--font-heading);font-weight:800;font-size:15px">${f.username}</div>
              <div style="font-size:12px;color:var(--color-neutral-700)">${f.count} dischi${f.bio ? ' · ' + f.bio : ''}</div>
            </div>
          </div>
          <span style="font-size:13px;color:var(--color-neutral-700)">${formatEuro(f.total_value)}</span>
        </a>
      `).join('');
    } catch (err) { toast(err.message); }
  }
  init();
</script>
</body>
</html>
