<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solco — Crea account</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1a19">
<link rel="stylesheet" href="/assets/style.css">
<script>
  var desktopOk = document.cookie.indexOf('desktop_ok=1') !== -1;
  if (!desktopOk && !(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone)) {
    location.replace('/install.html');
  }
</script>
</head>
<body>
<div class="screen screen--no-tabbar" style="justify-content:center;min-height:100vh;gap:28px">
  <div>
    <div style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-family:var(--font-heading);font-weight:800">Solco</div>
    <h1 style="font-size:34px;margin-top:14px;line-height:1.05" id="page-title">Crea il primo account</h1>
    <p id="page-sub" style="margin-top:10px;font-size:14px;color:var(--color-neutral-700)">Avrai la tua collezione personale e diventerai Amministratore di Solco.</p>
  </div>

  <form id="register-form" style="display:flex;flex-direction:column;gap:16px" novalidate>
    <div class="field" id="invite-field" style="display:none">
      <label for="code">Codice invito</label>
      <input class="input" id="code" name="code" required>
    </div>
    <div class="field">
      <label for="username">Nome utente</label>
      <input class="input" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <p id="reg-error" style="color:var(--color-danger);font-size:13px;display:none"></p>
    <button class="btn btn-primary btn-block" type="submit" id="reg-submit">Crea account</button>
  </form>

  <div style="text-align:center;font-size:13px;color:var(--color-neutral-700)">
    Hai già un account? <a href="/login.html">Accedi</a>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const inviteCode = params.get('invite');
  if (inviteCode) {
    document.getElementById('page-title').textContent = 'Unisciti a Solco';
    document.getElementById('page-sub').textContent = 'Avrai la tua collezione personale e potrai vedere quella dei tuoi amici.';
    document.getElementById('invite-field').style.display = 'flex';
    document.getElementById('code').value = inviteCode;
  }

  const form = document.getElementById('register-form');
  const errorEl = document.getElementById('reg-error');
  const submitBtn = document.getElementById('reg-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creazione…';
    try {
      const endpoint = inviteCode ? '/api/register' : '/api/bootstrap';
      const body = { username: form.username.value.trim(), email: form.email.value.trim(), password: form.password.value };
      if (inviteCode) body.code = form.code.value.trim();
      const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Non è stato possibile creare l\'account');
      haptic(HAPTIC.success);
      location.href = '/login.html';
    } catch (err) {
      haptic(HAPTIC.error);
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Crea account';
    }
  });
</script>
</body>
</html>
