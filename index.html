<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solco — Libreria</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1a19">
<link rel="stylesheet" href="/assets/style.css">
<script>
  var desktopOk = document.cookie.indexOf('desktop_ok=1') !== -1;
  if (!desktopOk && !(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone)) {
    location.replace('/install.html');
  }
</script>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <h1>Libreria</h1>
    <button class="icon-btn" id="profile-btn" aria-label="Profilo e impostazioni">☰</button>
  </div>

  <input class="input" id="search-input" placeholder="Cerca artista, titolo, etichetta…" style="font-size:15px">

  <div id="stat-row" class="stat-row" style="display:none">
    <div class="stat"><div class="stat-label">Dischi</div><div class="stat-value" id="stat-count">—</div></div>
    <div class="stat"><div class="stat-label">Valore</div><div class="stat-value" id="stat-value">—</div></div>
    <div class="stat"><div class="stat-label">Media</div><div class="stat-value" id="stat-avg">—</div></div>
  </div>

  <div class="chip-row" id="chip-row"></div>

  <div class="grid-controls">
    <select class="input" id="sort-select">
      <option value="added_desc">Aggiunti di recente</option>
      <option value="artist">Artista, A-Z</option>
      <option value="value_desc">Valore, decrescente</option>
      <option value="condition">Condizione</option>
    </select>
    <button class="icon-btn" id="view-toggle" aria-label="Cambia vista">▤</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="list" style="display:none"></div>
  <div id="empty-state" class="empty-state" style="display:none">
    <h3>Nessun disco ancora</h3>
    <p>Tocca "Scansiona" per aggiungere il primo vinile alla libreria.</p>
  </div>
</div>

<button class="fab" id="scan-fab" aria-label="Scansiona">◎</button>

<nav class="tabbar">
  <button class="tab active"><span class="tab-icon">▤</span>Libreria</button>
  <a class="tab" href="/amici.html"><span class="tab-icon">◐</span>Amici</a>
  <a class="tab" href="/statistiche.html"><span class="tab-icon">◆</span>Statistiche</a>
  <a class="tab" href="/cerca.html"><span class="tab-icon">☆</span>Da cercare</a>
</nav>

<!-- pannello profilo / impostazioni (dietro l'icona, non sempre in vista) -->
<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="profile-sheet">
  <div class="sheet-handle"></div>
  <div style="display:flex;align-items:center;gap:12px">
    <div id="profile-avatar" style="width:52px;height:52px;background:var(--color-neutral-200);flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden"></div>
    <div>
      <h3 id="profile-username" style="font-size:18px">—</h3>
      <p id="profile-bio" style="font-size:13px;color:var(--color-neutral-700);margin-top:2px"></p>
    </div>
  </div>
  <a href="/profilo.html" class="btn btn-secondary btn-block">Modifica profilo</a>
  <div id="admin-link-wrap" style="display:none">
    <a href="/admin.html" class="btn btn-secondary btn-block">Gestisci utenti e inviti</a>
  </div>
  <button class="btn btn-outline btn-block" id="logout-btn">Esci</button>
</div>

<script src="/assets/app.js"></script>
<script>
  let allAlbums = [];
  let activeChip = 'Tutti';
  let viewMode = localStorage.getItem('solco_view') || 'grid';
  let sortMode = localStorage.getItem('solco_sort') || 'added_desc';

  function sortAlbums(list) {
    const arr = [...list];
    if (sortMode === 'artist') arr.sort((a, b) => a.artist.localeCompare(b.artist));
    else if (sortMode === 'value_desc') arr.sort((a, b) => (b.value_estimate || 0) - (a.value_estimate || 0));
    else if (sortMode === 'condition') arr.sort((a, b) => (CONDITION_CODES.indexOf(a.condition_media)) - (CONDITION_CODES.indexOf(b.condition_media)));
    // added_desc: l'ordine arriva già così dal server
    return arr;
  }

  function renderGrid() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    let filtered = allAlbums;
    if (activeChip !== 'Tutti') filtered = filtered.filter(a => a.genre === activeChip);
    if (q) filtered = filtered.filter(a =>
      [a.artist, a.title, a.label].filter(Boolean).some(v => v.toLowerCase().includes(q))
    );
    filtered = sortAlbums(filtered);

    const grid = document.getElementById('grid');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty-state');
    if (allAlbums.length === 0) { grid.style.display = 'none'; list.style.display = 'none'; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    if (viewMode === 'list') {
      grid.style.display = 'none'; list.style.display = 'flex'; list.style.flexDirection = 'column';
      list.innerHTML = filtered.map(a => recordListRowHtml(a)).join('');
    } else {
      list.style.display = 'none'; grid.style.display = 'grid';
      grid.innerHTML = filtered.map(a => recordCardHtml(a)).join('');
    }
  }

  function renderChips() {
    const genres = [...new Set(allAlbums.map(a => a.genre).filter(Boolean))];
    const chips = ['Tutti', ...genres];
    document.getElementById('chip-row').innerHTML = chips.map(g =>
      `<button class="chip ${g === activeChip ? 'active' : ''}" data-genre="${g}">${g}</button>`
    ).join('');
    document.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => {
      activeChip = el.dataset.genre;
      haptic(HAPTIC.tap);
      renderChips(); renderGrid();
    }));
  }

  async function init() {
    const me = await loadCurrentUser();
    if (me) {
      document.getElementById('profile-username').textContent = me.username;
      document.getElementById('profile-bio').textContent = me.bio || '';
      document.getElementById('profile-avatar').innerHTML = me.avatar_url
        ? `<img src="${me.avatar_url}" style="width:100%;height:100%;object-fit:cover">`
        : `<span style="font-family:var(--font-heading);font-weight:800;color:var(--color-neutral-700)">${me.username[0].toUpperCase()}</span>`;
      if (me.role === 'Amministratore') document.getElementById('admin-link-wrap').style.display = 'block';
    }
    try {
      const [albumData, statsData] = await Promise.all([api('/api/album'), api('/api/stats')]);
      allAlbums = albumData.albums;
      renderChips();
      renderGrid();
      if (statsData.count > 0) {
        document.getElementById('stat-row').style.display = 'flex';
        document.getElementById('stat-count').textContent = statsData.count;
        document.getElementById('stat-value').textContent = formatEuro(statsData.total_value);
        document.getElementById('stat-avg').textContent = statsData.avg_condition;
      }
    } catch (err) { toast(err.message); }
  }
  init();

  document.getElementById('search-input').addEventListener('input', debounce(renderGrid, 150));
  document.getElementById('scan-fab').addEventListener('click', () => { haptic(HAPTIC.tap); location.href = '/scansione.html'; });
  document.getElementById('profile-btn').addEventListener('click', () => openSheet('profile-sheet'));
  document.getElementById('sheet-backdrop').addEventListener('click', () => closeSheet('profile-sheet'));
  document.getElementById('logout-btn').addEventListener('click', doLogout);

  document.getElementById('sort-select').value = sortMode;
  document.getElementById('sort-select').addEventListener('change', (e) => {
    sortMode = e.target.value;
    localStorage.setItem('solco_sort', sortMode);
    renderGrid();
  });
  document.getElementById('view-toggle').textContent = viewMode === 'list' ? '☰' : '▤';
  document.getElementById('view-toggle').addEventListener('click', () => {
    viewMode = viewMode === 'grid' ? 'list' : 'grid';
    localStorage.setItem('solco_view', viewMode);
    document.getElementById('view-toggle').textContent = viewMode === 'list' ? '☰' : '▤';
    haptic(HAPTIC.tap);
    renderGrid();
  });
</script>
</body>
</html>
