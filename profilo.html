<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solco — Profilo</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1a19">
<link rel="stylesheet" href="/assets/style.css">
<script>
  var desktopOk = document.cookie.indexOf('desktop_ok=1') !== -1;
  if (!desktopOk && !(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone)) {
    location.replace('/install.html');
  }
</script>
</head>
<body>
<div class="screen screen--no-tabbar">
  <div class="topbar">
    <a href="/index.html" class="back-link">← Libreria</a>
  </div>
  <h1 style="font-size:28px">Il tuo profilo</h1>

  <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
    <button id="avatar-btn" style="width:104px;height:104px;border:none;padding:0;background:var(--color-neutral-200);position:relative;overflow:hidden" aria-label="Cambia foto">
      <img id="avatar-preview" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none">
      <span id="avatar-placeholder" style="font-family:var(--font-heading);font-weight:800;font-size:34px;color:var(--color-neutral-700);display:flex;align-items:center;justify-content:center;width:100%;height:100%">?</span>
      <div style="position:absolute;left:0;right:0;bottom:0;background:rgba(28,26,25,.72);color:#fff;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 0;text-align:center">Cambia</div>
    </button>
    <input type="file" id="avatar-input" accept="image/*" capture="environment" style="display:none">
  </div>

  <form id="profile-form" style="display:flex;flex-direction:column;gap:14px">
    <div class="field">
      <label>Nome utente</label>
      <input class="input" id="p-username" disabled style="opacity:.6">
    </div>
    <div class="field">
      <label>Bio</label>
      <textarea class="input" id="p-bio" rows="3" maxlength="280" placeholder="Qualche parola su di te e sui tuoi gusti musicali…"></textarea>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="save-btn">Salva</button>
  </form>
</div>

<script src="/assets/app.js"></script>
<script>
  let pendingAvatar = null;

  function setAvatarPreview(src) {
    const img = document.getElementById('avatar-preview');
    const placeholder = document.getElementById('avatar-placeholder');
    if (src) { img.src = src; img.style.display = 'block'; placeholder.style.display = 'none'; }
    else { img.style.display = 'none'; placeholder.style.display = 'flex'; }
  }

  async function init() {
    const me = await loadCurrentUser();
    if (!me) return;
    document.getElementById('p-username').value = me.username;
    document.getElementById('p-bio').value = me.bio || '';
    setAvatarPreview(me.avatar_url || null);
    document.getElementById('avatar-placeholder').textContent = me.username[0].toUpperCase();
  }
  init();

  document.getElementById('avatar-btn').addEventListener('click', () => document.getElementById('avatar-input').click());
  document.getElementById('avatar-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImageToDataUrl(file);
      pendingAvatar = dataUrl;
      setAvatarPreview(dataUrl);
      haptic(HAPTIC.tap);
    } catch (err) { toast(err.message); }
  });

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Salvataggio…';
    try {
      const body = { bio: document.getElementById('p-bio').value.trim() };
      if (pendingAvatar) body.avatar_url = pendingAvatar;
      await api('/api/me', { method: 'PATCH', body: JSON.stringify(body) });
      haptic(HAPTIC.success);
      toast('Profilo aggiornato');
      setTimeout(() => location.href = '/index.html', 500);
    } catch (err) {
      haptic(HAPTIC.error);
      toast(err.message);
      btn.disabled = false; btn.textContent = 'Salva';
    }
  });
</script>
</body>
</html>
